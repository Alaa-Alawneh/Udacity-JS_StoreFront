services:
  postgres:
    image: postgres:14
    container_name: storefront_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storefront_dev
    ports:
      - "5432:5432"
    volumes:
      - storefront_postgres_data:/var/lib/postgresql/data

volumes:
  storefront_postgres_data: